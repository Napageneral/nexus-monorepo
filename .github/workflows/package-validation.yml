name: Package Validation

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'contracts/**'
      - 'nex/**'
      - '.github/workflows/package-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'contracts/**'
      - 'nex/**'
      - '.github/workflows/package-validation.yml'
  workflow_dispatch:

jobs:
  validate-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the pinned Nex commit
        id: nex-pin
        run: echo "sha=$(git ls-tree HEAD nex | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      # Napageneral/nex is private, so the job's own GITHUB_TOKEN cannot clone it.
      - name: Require the Nex read token
        env:
          NEX_REPO_READ_TOKEN: ${{ secrets.NEX_REPO_READ_TOKEN }}
        run: |
          if [ -z "$NEX_REPO_READ_TOKEN" ]; then
            echo "::error::Actions secret NEX_REPO_READ_TOKEN is not set: add a fine-grained token with Contents: read on Napageneral/nex."
            exit 1
          fi

      - name: Checkout Nex runtime
        uses: actions/checkout@v4
        with:
          repository: Napageneral/nex
          ref: ${{ steps.nex-pin.outputs.sha }}
          token: ${{ secrets.NEX_REPO_READ_TOKEN }}
          path: nex
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: nex/pnpm-lock.yaml

      - name: Install Nex dependencies
        run: pnpm install --frozen-lockfile
        working-directory: nex

      - name: Build Nex CLI
        run: pnpm build
        working-directory: nex

      - name: Audit package tree
        run: python3 packages/scripts/audit-packages.py

      # Pull requests and pushes validate the package roots they change; a
      # manual run validates every root.
      - name: Validate package roots
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            bash packages/scripts/validate-package-roots.sh
          else
            bash packages/scripts/validate-package-roots.sh --changed-since "$BASE_SHA"
          fi
