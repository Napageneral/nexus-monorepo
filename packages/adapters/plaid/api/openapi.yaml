openapi: 3.1.0
info:
  title: plaid-adapter Adapter API
  version: 0.3.1
  description: "Published adapter package contract for plaid. This artifact covers
    ordinary JSON request/response adapter operations. Long-lived stream/session
    operations remain in the shared adapter protocol and are intentionally
    omitted here: adapter.monitor.start."
tags:
  - name: Adapter
paths:
  /operations/adapter.connections.list:
    post:
      operationId: adapter.connections.list
      summary: List adapter connections
      tags:
        - Adapter
      x-sdk-public: true
      responses:
        "200":
          description: Successful adapter package response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterConnectionsListResultSchema"
  /operations/adapter.health:
    post:
      operationId: adapter.health
      summary: Check adapter connection health
      tags:
        - Adapter
      x-sdk-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdapterConnectionRequestSchema"
      responses:
        "200":
          description: Successful adapter package response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterHealthSchema"
  /operations/adapter.info:
    post:
      operationId: adapter.info
      summary: Read adapter package metadata
      tags:
        - Adapter
      x-sdk-public: true
      responses:
        "200":
          description: Successful adapter package response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdapterInfoSchema"
  /operations/plaid.accounts.balance.get:
    post:
      operationId: plaid.accounts.balance.get
      summary: Request a real-time balance snapshot for all or selected provider
        accounts.
      tags:
        - Adapter
      x-sdk-public: true
      x-nexus-action: read
      x-nexus-mutates-remote: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connection_id:
                  type: string
                payload:
                  additionalProperties: false
                  properties:
                    provider_account_ids:
                      items:
                        type: string
                      maxItems: 100
                      type: array
                  type: object
      responses:
        "200":
          description: Successful adapter method response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  accounts:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  credential_bindings:
                    additionalProperties: true
                    type: object
                  evidence:
                    additionalProperties: true
                    type: object
                  raw: {}
                required:
                  - evidence
                  - credential_bindings
                  - accounts
                  - raw
                type: object
  /operations/plaid.accounts.list:
    post:
      operationId: plaid.accounts.list
      summary: Read accounts and provider-reported balances for the bound Plaid Item.
      tags:
        - Adapter
      x-sdk-public: true
      x-nexus-action: read
      x-nexus-mutates-remote: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connection_id:
                  type: string
                payload:
                  additionalProperties: false
                  type: object
      responses:
        "200":
          description: Successful adapter method response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  accounts:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  credential_bindings:
                    additionalProperties: true
                    type: object
                  evidence:
                    additionalProperties: true
                    type: object
                  raw: {}
                required:
                  - evidence
                  - credential_bindings
                  - accounts
                  - raw
                type: object
  /operations/plaid.institutions.coverage:
    post:
      operationId: plaid.institutions.coverage
      summary: Probe Plaid institution product coverage by institution id or search
        query without an Item credential.
      tags:
        - Adapter
      x-sdk-public: true
      x-nexus-action: read
      x-nexus-mutates-remote: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connection_id:
                  type: string
                payload:
                  additionalProperties: false
                  properties:
                    count:
                      maximum: 10
                      minimum: 1
                      type: integer
                    country_codes:
                      items:
                        type: string
                      maxItems: 100
                      type: array
                    institution_ids:
                      items:
                        type: string
                      maxItems: 100
                      type: array
                    query:
                      maxLength: 100
                      minLength: 1
                      type: string
                    requested_products:
                      items:
                        type: string
                      maxItems: 100
                      type: array
                  type: object
      responses:
        "200":
          description: Successful adapter method response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  credential_bindings:
                    additionalProperties: true
                    type: object
                  institutions:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                required:
                  - credential_bindings
                  - institutions
                type: object
  /operations/plaid.item.get:
    post:
      operationId: plaid.item.get
      summary: Read the Plaid Item and transaction update status for the bound
        connection.
      tags:
        - Adapter
      x-sdk-public: true
      x-nexus-action: read
      x-nexus-mutates-remote: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connection_id:
                  type: string
                payload:
                  additionalProperties: false
                  type: object
      responses:
        "200":
          description: Successful adapter method response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  credential_bindings:
                    additionalProperties: true
                    type: object
                  evidence:
                    additionalProperties: true
                    type: object
                  item:
                    additionalProperties: true
                    type: object
                  raw: {}
                required:
                  - evidence
                  - credential_bindings
                  - item
                  - raw
                type: object
  /operations/plaid.liabilities.get:
    post:
      operationId: plaid.liabilities.get
      summary: Read credit-card liability facts for all or selected provider accounts.
      tags:
        - Adapter
      x-sdk-public: true
      x-nexus-action: read
      x-nexus-mutates-remote: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connection_id:
                  type: string
                payload:
                  additionalProperties: false
                  properties:
                    provider_account_ids:
                      items:
                        type: string
                      maxItems: 100
                      type: array
                  type: object
      responses:
        "200":
          description: Successful adapter method response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  credential_bindings:
                    additionalProperties: true
                    type: object
                  credit:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  evidence:
                    additionalProperties: true
                    type: object
                  raw: {}
                required:
                  - evidence
                  - credential_bindings
                  - credit
                  - raw
                type: object
  /operations/plaid.transactions.sync:
    post:
      operationId: plaid.transactions.sync
      summary: Read transaction changes after a cursor, restart concurrent provider
        mutations, and return explicit non-committable terminal evidence on any
        fetched-page failure.
      tags:
        - Adapter
      x-sdk-public: true
      x-nexus-action: read
      x-nexus-mutates-remote: false
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                connection_id:
                  type: string
                payload:
                  additionalProperties: false
                  properties:
                    count:
                      maximum: 500
                      minimum: 1
                      type: integer
                    cursor:
                      type: string
                    max_pages:
                      maximum: 1000
                      minimum: 1
                      type: integer
                    max_restarts:
                      maximum: 10
                      minimum: 0
                      type: integer
                  type: object
      responses:
        "200":
          description: Successful adapter method response
          content:
            application/json:
              schema:
                additionalProperties: true
                properties:
                  added:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  changes:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  completion_state:
                    enum:
                      - complete
                      - terminal_error
                    type: string
                  credential_bindings:
                    additionalProperties: true
                    type: object
                  cursor_commit_allowed:
                    type: boolean
                  modified:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  next_cursor:
                    type: string
                  page_evidence:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  pages:
                    minimum: 0
                    type: integer
                  raw_pages:
                    items: {}
                    type: array
                  removed:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  restart_evidence:
                    items:
                      additionalProperties: true
                      type: object
                    type: array
                  restarts:
                    minimum: 0
                    type: integer
                  terminal_error:
                    additionalProperties: true
                    type:
                      - object
                      - "null"
                required:
                  - credential_bindings
                  - completion_state
                  - cursor_commit_allowed
                  - next_cursor
                  - pages
                  - restarts
                  - added
                  - modified
                  - removed
                  - changes
                  - page_evidence
                  - raw_pages
                  - restart_evidence
                  - terminal_error
                type: object
components:
  schemas:
    AdapterInfoSchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        platform:
          type: string
        name:
          type: string
        version:
          type: string
        operations:
          type: array
          items:
            type: string
            enum:
              - adapter.info
              - adapter.health
              - adapter.connections.list
              - adapter.monitor.start
              - adapter.serve.start
              - adapter.setup.start
              - adapter.setup.submit
              - adapter.setup.status
              - adapter.setup.cancel
              - records.backfill
        methods:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                anyOf:
                  - type: string
                  - type: "null"
              action:
                type: string
                enum:
                  - read
                  - write
              params:
                anyOf:
                  - type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  - type: "null"
              response:
                anyOf:
                  - type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  - type: "null"
              connection_required:
                type: boolean
              mutates_remote:
                type: boolean
              context_hints:
                type: object
                properties:
                  params:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      type: object
                      properties:
                        value: {}
                        source:
                          type: string
                        confidence:
                          type: string
                          enum:
                            - exact
                            - derived
                            - weak
                      required:
                        - value
                        - source
                        - confidence
                      additionalProperties: false
                required:
                  - params
                additionalProperties: false
              origin:
                type: object
                properties:
                  package_kind:
                    type: string
                    const: adapter
                  package_id:
                    anyOf:
                      - type: string
                      - type: "null"
                  package_version:
                    anyOf:
                      - type: string
                      - type: "null"
                  declaration_mode:
                    type: string
                    enum:
                      - manifest
                      - openapi
                      - builtin
                  declaration_source:
                    type: string
                  namespace:
                    type: string
                required:
                  - package_kind
                  - package_id
                  - package_version
                  - declaration_mode
                  - declaration_source
                  - namespace
                additionalProperties: false
            required:
              - name
            additionalProperties: false
        credential_service:
          type: string
        multi_account:
          type: boolean
        platform_capabilities:
          type: object
          properties:
            text_limit:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            caption_limit:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            supports_markdown:
              type: boolean
            markdown_flavor:
              type: string
            supports_tables:
              type: boolean
            supports_code_blocks:
              type: boolean
            supports_embeds:
              type: boolean
            supports_threads:
              type: boolean
            supports_reactions:
              type: boolean
            supports_polls:
              type: boolean
            supports_buttons:
              type: boolean
            supports_edit:
              type: boolean
            supports_delete:
              type: boolean
            supports_media:
              type: boolean
            supports_voice_notes:
              type: boolean
            supports_streaming_edit:
              type: boolean
            supports_ptt:
              type: boolean
            supports_streaming:
              type: boolean
            max_message_length:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            max_attachments:
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
          additionalProperties: {}
        auth:
          type: object
          properties:
            methods:
              type: array
              items:
                oneOf:
                  - type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        const: oauth2
                      label:
                        type: string
                      icon:
                        type: string
                      service:
                        type: string
                      scopes:
                        type: array
                        items:
                          type: string
                      platformCredentials:
                        type: boolean
                      platformCredentialUrl:
                        type: string
                    required:
                      - id
                      - type
                      - label
                      - icon
                      - service
                      - scopes
                    additionalProperties: false
                  - type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        const: api_key
                      label:
                        type: string
                      icon:
                        type: string
                      service:
                        type: string
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            label:
                              type: string
                            type:
                              type: string
                              enum:
                                - secret
                                - text
                                - select
                            required:
                              type: boolean
                            placeholder:
                              type: string
                            options:
                              type: array
                              items:
                                type: object
                                properties:
                                  label:
                                    type: string
                                  value:
                                    type: string
                                required:
                                  - label
                                  - value
                                additionalProperties: false
                          required:
                            - name
                            - label
                            - type
                            - required
                          additionalProperties: false
                    required:
                      - id
                      - type
                      - label
                      - icon
                      - service
                      - fields
                    additionalProperties: false
                  - type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        const: file_upload
                      label:
                        type: string
                      icon:
                        type: string
                      accept:
                        type: array
                        items:
                          type: string
                      templateUrl:
                        type: string
                      maxSize:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                    required:
                      - id
                      - type
                      - label
                      - icon
                      - accept
                    additionalProperties: false
                  - type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        const: custom_flow
                      label:
                        type: string
                      icon:
                        type: string
                      service:
                        type: string
                      fields:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            label:
                              type: string
                            type:
                              type: string
                              enum:
                                - secret
                                - text
                                - select
                            required:
                              type: boolean
                            placeholder:
                              type: string
                            options:
                              type: array
                              items:
                                type: object
                                properties:
                                  label:
                                    type: string
                                  value:
                                    type: string
                                required:
                                  - label
                                  - value
                                additionalProperties: false
                          required:
                            - name
                            - label
                            - type
                            - required
                          additionalProperties: false
                    required:
                      - id
                      - type
                      - label
                      - icon
                      - service
                    additionalProperties: false
            setupGuide:
              type: string
          required:
            - methods
          additionalProperties: false
        methodCatalog:
          type: object
          properties:
            source:
              type: string
              enum:
                - manifest
                - openapi
            document:
              type: string
            namespace:
              type: string
          additionalProperties: false
      required:
        - platform
        - name
        - version
        - operations
        - methods
        - multi_account
        - platform_capabilities
      additionalProperties: false
    AdapterConnectionIdentitySchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        id:
          type: string
        display_name:
          type: string
        account:
          type: string
        account_contact:
          type: object
          properties:
            platform:
              type: string
            space_id:
              type: string
            contact_id:
              type: string
          required:
            - platform
            - space_id
            - contact_id
          additionalProperties: false
        credential_ref:
          type: string
        status:
          type: string
          enum:
            - ready
            - active
            - error
      required:
        - id
        - status
      additionalProperties: false
    AdapterHealthSchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        connected:
          type: boolean
        connection_id:
          type: string
        account:
          type: string
        account_contact:
          type: object
          properties:
            platform:
              type: string
            space_id:
              type: string
            contact_id:
              type: string
          required:
            - platform
            - space_id
            - contact_id
          additionalProperties: false
        last_event_at:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        error:
          type: string
        details:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
        - connected
        - connection_id
      additionalProperties: false
    AdapterSetupResultSchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - requires_input
            - completed
            - failed
            - cancelled
        session_id:
          type: string
        connection_id:
          type: string
        service:
          type: string
        account:
          type: string
        account_contact:
          type: object
          properties:
            platform:
              type: string
            space_id:
              type: string
            contact_id:
              type: string
          required:
            - platform
            - space_id
            - contact_id
          additionalProperties: false
        message:
          type: string
        instructions:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              label:
                type: string
              type:
                type: string
                enum:
                  - secret
                  - text
                  - select
              required:
                type: boolean
              placeholder:
                type: string
              options:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    value:
                      type: string
                  required:
                    - label
                    - value
                  additionalProperties: false
            required:
              - name
              - label
              - type
              - required
            additionalProperties: false
        secret_fields:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        metadata:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
        - status
      additionalProperties: {}
    AdapterConnectionsListResultSchema:
      type: array
      items:
        $ref: "#/components/schemas/AdapterConnectionIdentitySchema"
    AdapterEmptyRequestSchema:
      type: object
      additionalProperties: false
      properties: {}
    AdapterConnectionRequestSchema:
      type: object
      additionalProperties: false
      required:
        - connection_id
      properties:
        connection_id:
          type: string
    AdapterSetupRequestSchema:
      type: object
      additionalProperties: false
      properties:
        connection_id:
          type: string
        session_id:
          type: string
        payload:
          type: object
          additionalProperties: true
