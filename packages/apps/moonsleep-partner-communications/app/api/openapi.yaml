      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                    - alibaba
                    - gmail
                connection_id:
                  type: string
                  minLength: 1
                  maxLength: 256
                provider_thread_id:
                  type: string
                  minLength: 1
                  maxLength: 512
                coverage_state:
                  type: string
                  enum:
                    - unreviewed
                    - proposed
                    - proposal_conflict
                    - reviewed
                offset:
                  type: integer
                  minimum: 0
                  maximum: 99999
                limit:
